# Overlay for production images. Set HTTPS origins, merchant, SMS, and DB credentials first.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a production database password}
  backend:
    environment:
      NODE_ENV: production
      ADMIN_MOBILES: ${ADMIN_MOBILES:?Set administrator mobile numbers}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the public HTTPS storefront origin}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?Set the public HTTPS API origin}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:?Set the live Zarinpal merchant UUID}
      ZARINPAL_SANDBOX: "false"
      OTP_PROVIDER_URL: ${OTP_PROVIDER_URL:?Set the HTTPS SMS bridge URL}
      OTP_PROVIDER_TOKEN: ${OTP_PROVIDER_TOKEN:?Set the SMS bridge credential}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SEED_CATALOG: "false"
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?Set the public HTTPS API origin}
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_ORIGIN:?Set the public HTTPS storefront origin}
    environment:
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?Set the public HTTPS API origin}
      INTERNAL_API_URL: http://backend:4000
